<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salt'n Pepper Restaurant</title>

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Start -->
    <header class="header">

        <div class="header-container">

            <!-- Logo -->
            <div class="logo">
                <a href="#">
                    <img src="images/logo.png" alt="Salt'n Pepper Restaurant">
                </a>
            </div>


            <!-- Navigation -->
            <nav class="navbar">
                <ul class="nav-links">
                    <li>
                        <a href="#">Home</a>
                    </li>

                    <li>
                        <a href="#">About Us</a>
                    </li>

                    <li>
                        <a href="#">Publications</a>
                    </li>
                </ul>
            </nav>


            <!-- Header Buttons -->
            <div class="header-buttons">

                <a href="#" class="franchise-btn">
                    Get a Franchise
                </a>

                <a href="#" class="order-btn">
                    Order Online
                    <span class="order-icon">
                        <i class="fa-solid fa-arrow-right"></i>
                    </span>
                </a>

            </div>

        </div>

    </header>

    <div class="banner-container">
    <img src="images/banner.png" alt="Banner Image" class="banner-img">
</div>

<!-- Brands Section Start -->
    <section class="brands-section">
        <div class="brands-container">
            
            <h1 class="brands-title">Welcome to <span>Salt'n Pepper</span><br> Restaurants! Our Brands</h1>
            <p class="brands-subtitle">Please click our brands below for further information, reservations or to order online!</p>

            <div class="brands-grid">
                
                <!-- Brand 1 -->
                <div class="brand-card">
                    <div class="brand-logo-box">
                        <img src="images/brand1.png" alt="Salt'n Pepper Restaurant">
                    </div>
                    <a href="#" class="brand-btn">Order Now</a>
                </div>

                <!-- Brand 2 -->
                <div class="brand-card">
                    <div class="brand-logo-box">
                        <img src="images/brand2.png" alt="Salt'n Pepper Express">
                    </div>
                    <a href="#" class="brand-btn">Order Now</a>
                </div>

                <!-- Brand 3 -->
                <div class="brand-card">
                    <div class="brand-logo-box">
                        <img src="images/brand3.png" alt="Salt'n Pepper Village">
                    </div>
                    <a href="#" class="brand-btn">Reserve a Table</a>
                </div>

                <!-- Brand 4 -->
                <div class="brand-card">
                    <div class="brand-logo-box">
                        <img src="images/brand4.png" alt="Salt'n Pepper Restaurant Signature">
                    </div>
                    <a href="#" class="brand-btn">Order Now</a>
                </div>

            </div>

        </div>
    </section>
    
</body>
</html>
